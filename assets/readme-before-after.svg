<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 550" role="img" aria-labelledby="title desc">
<title id="title">Same answer. A clearer picture.</title>
<desc id="desc">A paragraph about API retries becomes a visual explanation: the original request and its retry use the same key and resolve to the same saved result, within the API's documented window.</desc>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#faf8ff"/><stop offset="1" stop-color="#f0f7f4"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7041b5"/></marker>
</defs>
<rect width="1280" height="550" rx="20" fill="url(#paper)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <text x="48" y="49" fill="#7041b5" font-size="13" font-weight="700" letter-spacing="2">VIBEVIEW / FROM ANSWER TO UNDERSTANDING</text>
  <text x="48" y="108" fill="#292139" font-size="44" font-weight="750" letter-spacing="-1.5">Same answer. A clearer picture.</text>
  <path d="M48 137H1232" stroke="#dcd5e8"/>
  <text x="48" y="177" fill="#746d7e" font-size="12" font-weight="700" letter-spacing="1.6">THE PARAGRAPH</text>
  <text x="48" y="217" fill="#746d7e" font-size="19">When a request times out, the server</text>
  <text x="48" y="247" fill="#746d7e" font-size="19">may already have finished the work.</text>
  <text x="48" y="277" fill="#746d7e" font-size="19">Retry with the same idempotency key</text>
  <text x="48" y="307" fill="#746d7e" font-size="19">and parameters within the API’s retry</text>
  <text x="48" y="337" fill="#746d7e" font-size="19">window. A valid stored result can be</text>
  <text x="48" y="367" fill="#746d7e" font-size="19">returned without creating another task.</text>
  <text x="48" y="397" fill="#746d7e" font-size="19">The record and operation must stay</text>
  <text x="48" y="427" fill="#746d7e" font-size="19">consistent, even if a request fails.</text>
  <path d="M474 166V467" stroke="#dcd5e8"/>
  <text x="524" y="177" fill="#7041b5" font-size="12" font-weight="700" letter-spacing="1.6">THE IDEA, MADE VISIBLE</text>
  <text x="524" y="217" fill="#292139" font-size="27" font-weight="700">Two requests. One saved result.</text>
  <rect x="524" y="260" width="190" height="64" rx="8" fill="#eee5fa"/>
  <text x="544" y="286" fill="#7041b5" font-size="12" font-weight="700">FIRST REQUEST</text>
  <text x="544" y="310" fill="#292139" font-size="19" font-weight="650">Key K-A</text>
  <rect x="524" y="368" width="190" height="64" rx="8" fill="#eee5fa"/>
  <text x="544" y="394" fill="#7041b5" font-size="12" font-weight="700">RETRY AFTER TIMEOUT</text>
  <text x="544" y="418" fill="#292139" font-size="19" font-weight="650">Same key K-A</text>
  <path d="M724 292C815 292 807 346 902 346M724 400C815 400 807 346 902 346" fill="none" stroke="#7041b5" stroke-width="3"/>
  <path d="m891 338 12 8-12 8" fill="none" stroke="#7041b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="919" y="294" width="313" height="103" rx="8" fill="#e1f0e9" stroke="#8eb9a8"/>
  <text x="944" y="326" fill="#326f62" font-size="12" font-weight="700" letter-spacing="1.2">ORIGINAL RESULT</text>
  <text x="944" y="362" fill="#24594e" font-size="27" font-weight="750">ARC-17</text>
  <path d="m1156 349 12 12 22-26" fill="none" stroke="#326f62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="919" y="422" fill="#326f62" font-size="16" font-weight="600">No second task.</text>
  <text x="524" y="467" fill="#746d7e" font-size="14">Same operation · same parameters · valid record</text>
  <path d="M48 493H1232" stroke="#dcd5e8"/>
  <text x="48" y="524" fill="#746d7e" font-size="13">Illustrative example. The server must claim the key atomically and keep the operation and its record consistent.</text>
</g>
</svg>
